services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brandshield_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
    volumes:
      - brandshield_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brandshield_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:change_me@db:5432/brandshield_db
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:4173,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  brandshield_db_data:
